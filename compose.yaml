services:
  schema-foundry:
    build:
      context: .
    image: schema-foundry:local
    ports:
      - "127.0.0.1:${SCHEMA_FOUNDRY_HOST_PORT:-8080}:8080"
    environment:
      SCHEMA_FOUNDRY_HOST: 0.0.0.0
      SCHEMA_FOUNDRY_PORT: 8080
      SCHEMA_FOUNDRY_CONFIG_DIR: /data/config
      SCHEMA_FOUNDRY_SCHEMA_DIR: /data/schemas
      SCHEMA_FOUNDRY_BEHIND_LOOPBACK_PROXY: 1
    volumes:
      - schema-foundry-config:/data/config
      - schema-foundry-schemas:/data/schemas
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  schema-foundry-config:
  schema-foundry-schemas:
