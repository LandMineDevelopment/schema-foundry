name: schemii

services:
  schemii:
    build:
      context: .
    image: schemii:local
    ports:
      - "127.0.0.1:${SCHEMII_HOST_PORT:-8080}:8080"
    environment:
      SCHEMII_HOST: 0.0.0.0
      SCHEMII_PORT: 8080
      SCHEMII_CONFIG_DIR: /data/config
      SCHEMII_SCHEMA_DIR: /data/schemas
      SCHEMII_BEHIND_LOOPBACK_PROXY: 1
    volumes:
      - schemii-config:/data/config
      - schemii-schemas:/data/schemas
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  schemii-config:
  schemii-schemas:
