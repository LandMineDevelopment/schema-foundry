name: ${SCHEMII_INSTANCE:-schemii}

services:
  metadata-postgres:
    build:
      context: ./docker/metadata
    image: ${SCHEMII_METADATA_IMAGE:-schemii-metadata-postgres:local}
    environment:
      POSTGRES_DB: schemii_metadata
      POSTGRES_USER: schemii_metadata_bootstrap
      POSTGRES_PASSWORD_FILE: /tmp/schemii-metadata-secrets/metadata_bootstrap_password
    secrets:
      - metadata_bootstrap_password
      - metadata_migration_password
      - metadata_schemii_password
      - metadata_schemer_password
    volumes:
      - schemii-metadata-postgres:/var/lib/postgresql/data
      - ./docker/metadata/001_roles.sh:/docker-entrypoint-initdb.d/001_roles.sh:ro
      - ./docker/metadata/002_rotation_function.sql:/docker-entrypoint-initdb.d/002_rotation_function.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemii_metadata_migration -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  metadata-migrate:
    build:
      context: .
      target: schemii-runtime
    image: ${SCHEMII_IMAGE:-schemii:local}
    command: ["python", "-m", "schemii.metadata_migrate"]
    environment:
      SCHEMII_METADATA_DSN: host=metadata-postgres port=5432 dbname=schemii_metadata user=schemii_metadata_migration options='-c role=schemii_metadata_owner'
      SCHEMII_METADATA_APPLICATION_NAME: schemii-metadata-migrate
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_migration_password
    secrets:
      - metadata_migration_password
    depends_on:
      metadata-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: "no"

  schemii:
    build:
      context: .
    image: ${SCHEMII_IMAGE:-schemii:local}
    ports:
      - "127.0.0.1:${SCHEMII_HOST_PORT:-8080}:8080"
    environment:
      SCHEMII_HOST: 0.0.0.0
      SCHEMII_PORT: 8080
      SCHEMII_CONFIG_DIR: /data/config
      SCHEMII_SCHEMA_DIR: /data/schemas
      SCHEMER_DASHBOARD_DIR: /tmp/schemer-dashboards
      SCHEMII_BEHIND_LOOPBACK_PROXY: 1
      SCHEMII_EXAMPLES: local
      SCHEMII_METADATA_DSN: host=metadata-postgres port=5432 dbname=schemii_metadata user=schemii_metadata_schemii
      SCHEMII_METADATA_APPLICATION_NAME: schemii
      SCHEMII_METADATA_PASSWORD_FILE: /run/secrets/metadata_schemii_password
    secrets:
      - metadata_schemii_password
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
    volumes:
      - schemii-config:/data/config
      - schemii-schemas:/data/schemas
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/readiness', timeout=3).read(1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: on-failure

volumes:
  schemii-metadata-postgres:
  schemii-config:
  schemii-schemas:

secrets:
  metadata_bootstrap_password:
    file: ${SCHEMII_CREDENTIAL_DIR:?Set SCHEMII_CREDENTIAL_DIR to an absolute directory containing instance secret files}/metadata_bootstrap_password
  metadata_migration_password:
    file: ${SCHEMII_CREDENTIAL_DIR:?Set SCHEMII_CREDENTIAL_DIR to an absolute directory containing instance secret files}/metadata_migration_password
  metadata_schemii_password:
    file: ${SCHEMII_CREDENTIAL_DIR:?Set SCHEMII_CREDENTIAL_DIR to an absolute directory containing instance secret files}/metadata_schemii_password
  metadata_schemer_password:
    file: ${SCHEMII_CREDENTIAL_DIR:?Set SCHEMII_CREDENTIAL_DIR to an absolute directory containing instance secret files}/metadata_schemer_password
  opencode_password:
    file: ${SCHEMII_CREDENTIAL_DIR:?Set SCHEMII_CREDENTIAL_DIR to an absolute directory containing instance secret files}/opencode_password
