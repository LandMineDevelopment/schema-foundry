name: schemii

services:
  schemii:
    build:
      context: .
    image: schemii:local
    ports:
      - "127.0.0.1:${SCHEMII_HOST_PORT:-8080}:8080"
    environment:
      SCHEMII_HOST: 0.0.0.0
      SCHEMII_PORT: 8080
      SCHEMII_CONFIG_DIR: /data/config
      SCHEMII_SCHEMA_DIR: /data/schemas
      SCHEMII_BEHIND_LOOPBACK_PROXY: 1
    volumes:
      - schemii-config:/data/config
      - schemii-schemas:/data/schemas
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read(1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: on-failure

volumes:
  schemii-config:
  schemii-schemas:
