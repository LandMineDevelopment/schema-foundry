# Linux-only override for PostgreSQL bound to host loopback.
services:
  schemii:
    network_mode: host
    ports: !reset []
    environment:
      SCHEMII_HOST: 127.0.0.1
      SCHEMII_PORT: ${SCHEMII_HOST_PORT:-8080}
      SCHEMII_BEHIND_LOOPBACK_PROXY: 0
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['SCHEMII_PORT'] + '/', timeout=2).read(1)"]
