services:
  schemii:
    environment:
      SCHEMII_OPENCODE_URL: http://opencode:4096
      SCHEMII_OPENCODE_USERNAME: ${SCHEMII_OPENCODE_USERNAME:-opencode}
      SCHEMII_OPENCODE_PASSWORD: ${SCHEMII_OPENCODE_PASSWORD:?Set SCHEMII_OPENCODE_PASSWORD or use an AI launcher mode}
      SCHEMII_OPENCODE_TIMEOUT: ${SCHEMII_OPENCODE_TIMEOUT:-45}
    depends_on:
      opencode:
        condition: service_started

  opencode:
    build:
      context: ./ai
    image: schemii-opencode:1.18.15-local
    working_dir: /workspace
    command: serve --hostname 0.0.0.0 --port 4096
    environment:
      OPENCODE_SERVER_USERNAME: ${SCHEMII_OPENCODE_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${SCHEMII_OPENCODE_PASSWORD:?Set SCHEMII_OPENCODE_PASSWORD or use an AI launcher mode}
      XDG_DATA_HOME: /opencode/data
      XDG_CONFIG_HOME: /opencode/config
      XDG_STATE_HOME: /opencode/state
      XDG_CACHE_HOME: /opencode/cache
      OPENCODE_DISABLE_EXTERNAL_SKILLS: 1
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: 1
    volumes:
      - ./ai/workspace:/workspace:ro
      - schemii-opencode-data:/opencode/data
      - schemii-opencode-config:/opencode/config
      - schemii-opencode-state:/opencode/state
      - schemii-opencode-cache:/opencode/cache
    restart: unless-stopped

volumes:
  schemii-opencode-data:
  schemii-opencode-config:
  schemii-opencode-state:
  schemii-opencode-cache:
