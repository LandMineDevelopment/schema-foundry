services:
  schemii:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SCHEMII_POSTGRES_DB:-schemii}
      POSTGRES_USER: ${SCHEMII_POSTGRES_USER:-schemii}
      POSTGRES_PASSWORD: ${SCHEMII_POSTGRES_PASSWORD:-schemii-local}
    volumes:
      - schemii-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  schemii-postgres:
