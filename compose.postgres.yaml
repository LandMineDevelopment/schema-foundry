services:
  schema-foundry:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SCHEMA_FOUNDRY_POSTGRES_DB:-schema_foundry}
      POSTGRES_USER: ${SCHEMA_FOUNDRY_POSTGRES_USER:-schema_foundry}
      POSTGRES_PASSWORD: ${SCHEMA_FOUNDRY_POSTGRES_PASSWORD:-schema-foundry-local}
    volumes:
      - schema-foundry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  schema-foundry-postgres:
