name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q src
      - name: Validate PowerShell launcher
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "start.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/schemii/web/app.js
      - run: for test_file in tests/test_*.js; do node "$test_file" || exit 1; done

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      SCHEMII_OPENCODE_PASSWORD: ci-only-opencode-password
    steps:
      - uses: actions/checkout@v4
      - run: bash -n start.sh
      - run: docker compose config
      - run: docker compose -f compose.yaml -f compose.local-db.yaml config
      - run: docker compose -f compose.yaml -f compose.postgres.yaml config
      - run: docker compose -f compose.yaml -f compose.ai.yaml config
      - run: docker compose -f compose.yaml -f compose.local-db.yaml -f compose.ai.yaml -f compose.ai.local-db.yaml config
      - run: docker compose -f compose.yaml -f compose.postgres.yaml -f compose.ai.yaml config
      - name: Validate embedded OpenCode JSON
        run: python -m json.tool ai/workspace/opencode.json > /dev/null
      - run: docker compose -f compose.yaml -f compose.ai.yaml build opencode
      - name: Validate embedded OpenCode config, skills, and tools
        run: docker run --rm -v "$PWD/ai/workspace:/workspace:ro" -w /workspace schemii-opencode:1.18.15-local debug agent build > /dev/null
      - run: docker compose build
      - name: Smoke test container health
        run: |
          docker compose up -d
          container_id="$(docker compose ps -q schemii)"
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            [ "$health" = healthy ] && exit 0
            [ "$health" = unhealthy ] && exit 1
            sleep 1
          done
          exit 1
      - name: Stop smoke-test stack
        if: always()
        run: docker compose down
